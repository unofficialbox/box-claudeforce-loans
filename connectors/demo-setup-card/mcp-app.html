<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Setup</title>
    <style>
      :root {
        --ink: #1a1a1a; --muted: #5f6368; --line: #d9dde3; --paper: #ffffff; --panel: #f4f6f8;
        --blue: #2e74b5; --blue-dark: #1f4d78; --red: #b91c1c; --green: #1b7f4c;
        color-scheme: light;
      }
      :root.dark {
        --ink: #f1f3f5; --muted: #aab2bd; --line: #3a3f46; --paper: #1e2126; --panel: #262a30;
        --blue: #6aa8e8; --blue-dark: #9cc4f0; --red: #f08a8a; --green: #6fd19a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px 20px 16px; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--paper); }
      .kicker { margin: 0 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .lede { margin: 0 0 14px; color: var(--muted); }
      .grid { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); gap: 8px 14px; align-items: center; }
      label { font-weight: 600; color: var(--blue-dark); }
      input { width: 100%; padding: 8px 10px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
      input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
      input.invalid { border-color: var(--red); }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
      button { padding: 9px 14px; font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
      button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
      button:disabled { opacity: .55; cursor: default; }
      .status { margin: 12px 0 0; min-height: 1.4em; }
      .status.error { color: var(--red); }
      .status.ok { color: var(--green); }
      .summary { margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); white-space: pre-wrap; }
      .foot { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
      @media (max-width: 520px) { .grid { grid-template-columns: 1fr; gap: 4px 0; } label { margin-top: 6px; } }
    </style>
  </head>
  <body>
    <p class="kicker">Acme Bank · LOS demo</p>
    <h1>Demo Setup</h1>
    <p class="lede">Confirm the four environment bindings for this session, or change any of them first.</p>
    <form id="form" class="grid" autocomplete="off">
      <label for="boxEnterpriseId">Box enterprise ID</label>
      <input id="boxEnterpriseId" name="boxEnterpriseId" inputmode="numeric" placeholder="numeric ID" />
      <label for="creditPolicyHubId">Credit Policy Hub ID</label>
      <input id="creditPolicyHubId" name="creditPolicyHubId" inputmode="numeric" placeholder="numeric ID" />
      <label for="docgenCommitmentLetterTemplateId">Doc Gen commitment-letter template ID</label>
      <input id="docgenCommitmentLetterTemplateId" name="docgenCommitmentLetterTemplateId" inputmode="numeric" placeholder="numeric ID" />
      <label for="signerEmail">Signer email</label>
      <input id="signerEmail" name="signerEmail" type="email" placeholder="name@example.com" />
    </form>
    <div class="actions">
      <button id="confirm" class="primary" type="button">Use these for this session</button>
      <button id="reset" type="button">Reset to defaults</button>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="summary" class="summary" hidden></div>
    <p class="foot">This card confirms environment bindings only. Loan ID and folder come from the live record, and every loan write still needs a typed request.</p>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
